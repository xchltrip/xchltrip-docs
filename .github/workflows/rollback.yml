name: rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 要回滚到的完整提交号（40 位）
        required: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 校验提交号
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::提交号必须是 40 位小写十六进制"; exit 1; }

      - name: 配置部署连接
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          host=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          port=$(printf '%s' "$DEPLOY_PORT" | tr -d '[:space:]')
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $host
            Port $port
            User $user
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: 切换到指定版本
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: ssh deploy-target "switch $TARGET_SHA"

      - name: 清理密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
