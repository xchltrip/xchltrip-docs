name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://docs.xchltrip.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:content

      - name: 构建
        run: npm run build
        env:
          PUBLIC_ENV: production
          PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: 配置部署密钥
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::缺少 Secrets:$missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::DEPLOY_SSH_KEY 不是有效的私钥"; exit 1; }

      - name: 检查服务器连通
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          out=$(ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "ping" 2>&1) || true
          case "$out" in
            *"Host key verification"*)      echo "::error::DEPLOY_KNOWN_HOSTS 与服务器指纹不一致"; exit 1 ;;
            *"Permission denied"*)          echo "::error::部署私钥与服务器上的公钥不匹配，或 DEPLOY_USER 不正确"; exit 1 ;;
            *"timed out"*|*"Connection refused"*) echo "::error::无法连接服务器 SSH 端口，检查安全组和宝塔防火墙"; exit 1 ;;
            *denied*)                       echo "SSH 连通，部署密钥有效" ;;
            *)                              echo "::error::SSH 检查失败"; echo "$out" | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/***/g'; exit 1 ;;
          esac

      - name: 上传新版本
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --timeout=120 \
            -e "ssh -p $DEPLOY_PORT -i $HOME/.ssh/deploy_key -o BatchMode=yes -o LogLevel=ERROR" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$GITHUB_SHA/"

      - name: 切换线上版本
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o LogLevel=ERROR \
            "$DEPLOY_USER@$DEPLOY_HOST" "switch $GITHUB_SHA"

      - name: 冒烟检查
        run: |
          for i in $(seq 1 6); do
            if curl -fsS "$SITE_URL/" | grep -q "$GITHUB_SHA" \
              && curl -fsS -o /dev/null "$SITE_URL/manual/getting-started/login/" \
              && curl -fsS -o /dev/null "$SITE_URL/pagefind/pagefind.js"; then
              echo "新版本已生效"
              exit 0
            fi
            sleep 5
          done
          echo "::error::新版本未生效，请检查服务器或执行回滚"
          exit 1

      - name: 清理密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
